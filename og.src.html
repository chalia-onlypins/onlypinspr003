<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og 카드 — 특가</title>
<style>
  /* 아트보드 1200x630. 페이지와 같은 톤(옐로우·오렌지·티켓·굵은 산세리프). */
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    width:1200px; height:630px; overflow:hidden; position:relative;
    background:linear-gradient(135deg,#ffc63d 0%, #ff8a3d 52%, #f2560a 100%);
    color:#231703;
    font-family:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    word-break:keep-all; letter-spacing:-.035em;
  }
  body::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.14) 0 3px, transparent 3px 26px);
  }
  .board{position:relative; display:flex; height:100%; padding:56px 64px; gap:44px; align-items:center}
  .left{flex:1; min-width:0}

  .bar{display:flex; align-items:center; gap:10px; margin-bottom:26px}
  .bar img{width:38px; height:38px; border-radius:10px; display:block}
  .bar .bn{font-size:19px; font-weight:900; color:#fff}
  .bar .tag{font-size:13px; font-weight:900; color:#c2410c; background:#fff; padding:6px 13px; border-radius:7px}

  .badge{
    display:inline-block; transform:rotate(-2.5deg);
    background:#231703; color:#ffc63d; font-size:17px; font-weight:900;
    padding:9px 19px; border-radius:9px; margin-bottom:20px;
  }
  h1{font-size:62px; font-weight:900; line-height:1.14; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.1)}
  h1 .u{
    background:#fff; color:#c2410c; padding:0 12px; border-radius:8px;
    display:inline-block; transform:rotate(-1deg); margin-top:10px;
  }
  .sub{margin-top:24px; font-size:20px; font-weight:700; color:rgba(255,255,255,.97); line-height:1.55}

  .stats{display:flex; gap:11px; margin-top:30px}
  .st{background:rgba(255,255,255,.95); border-radius:13px; padding:13px 20px; text-align:center}
  .st .v{font-size:27px; font-weight:900; color:#c2410c; letter-spacing:-.055em}
  .st .l{font-size:12.5px; font-weight:800; color:#4a3a1d; margin-top:1px}

  /* 티켓 스택 */
  .right{flex:none; width:300px; display:flex; flex-direction:column; gap:12px}
  .tk{background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 12px 26px -14px rgba(0,0,0,.4)}
  .tk .t{padding:13px 16px 11px; display:flex; gap:11px; align-items:center}
  .tk .em{width:38px; height:38px; border-radius:10px; background:#fff6e4; display:grid; place-items:center; font-size:19px; flex:none}
  .tk .br2{font-size:11.5px; font-weight:800; color:#c2410c}
  .tk .nm{font-size:15px; font-weight:800; line-height:1.3; margin-top:1px}
  .tear{position:relative; height:1px; margin:0 11px}
  .tear::before{
    content:""; position:absolute; left:5px; right:5px; top:0; height:1px;
    background:repeating-linear-gradient(90deg,#f0e2c6 0 5px, transparent 5px 10px);
  }
  .tear i{position:absolute; top:50%; width:15px; height:15px; border-radius:50%; transform:translateY(-50%)}
  .tear i.l{left:-18px; background:#ffb04a}
  .tear i.r{right:-18px; background:#ffb04a}
  .tk .b{padding:9px 16px 12px; font-size:11.5px; font-weight:800; color:#8b7a5c}
</style>
</head>
<body>
  <div class="board">
    <div class="left">
      <div class="bar">
        <img src="{{LOGO}}" alt="">
        <span class="bn">온리핀스</span>
        <span class="tag">특가 코너</span>
      </div>

      <span class="badge">지금 특가에 올라와 있는 것</span>
      <h1>상품권도, 명품도<br><span class="u">먹을 것도 같이</span></h1>
      <p class="sub">도서문화상품권과 구찌 지갑, 크리스피크림이<br>한 코너에 나란히 올라옵니다.</p>

      <div class="stats">
        <div class="st"><div class="v">18</div><div class="l">특가 상품</div></div>
        <div class="st"><div class="v">1,881</div><div class="l">전체 상품</div></div>
        <div class="st"><div class="v">33</div><div class="l">브랜드</div></div>
      </div>
    </div>

    <div class="right">
      <div class="tk">
        <div class="t"><span class="em">📚</span><div><div class="br2">북앤라이프</div><div class="nm">도서문화상품권 7종</div></div></div>
        <div class="tear"><i class="l"></i><i class="r"></i></div>
        <div class="b">결제 후 1~2분 문자</div>
      </div>
      <div class="tk">
        <div class="t"><span class="em">👛</span><div><div class="br2">구찌 · 생로랑</div><div class="nm">지갑 · 크로스백</div></div></div>
        <div class="tear"><i class="l"></i><i class="r"></i></div>
        <div class="b">명품 특가 7점</div>
      </div>
      <div class="tk">
        <div class="t"><span class="em">🍩</span><div><div class="br2">크리스피 크림</div><div class="nm">미니 글레이즈드 세트</div></div></div>
        <div class="tear"><i class="l"></i><i class="r"></i></div>
        <div class="b">바로 쓰는 교환권</div>
      </div>
    </div>
  </div>
</body>
</html>
